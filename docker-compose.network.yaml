# Optional override when Docker Desktop's host DNS cannot resolve public APIs.
# Internal Compose service discovery remains on Docker's embedded resolver.
services:
  agent-worker:
    dns:
      - ${TRAVEL_DNS:-1.1.1.1}
      - ${TRAVEL_DNS_SECONDARY:-8.8.8.8}
  data-layer:
    dns:
      - ${TRAVEL_DNS:-1.1.1.1}
      - ${TRAVEL_DNS_SECONDARY:-8.8.8.8}
