name: Test and build
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:backend:agent_worker/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r agent_worker/requirements-dev.txt -r backend/requirements-dev.txt -r data_layer/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pytest agent_worker/tests -q
      - run: python -m pytest data_layer/tests tests -q
      - run: cd agent_worker && ruff check src tests && ruff format --check src tests
      - run: python scripts/secret_scan.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r agent_worker/requirements-dev.txt -r backend/requirements-dev.txt
      - shell: pwsh
        run: ./backend/integration_tests/run.ps1 -Python python
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
