name: travel-bot

services:
  mongodb:
    hostname: travel-mongodb
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-travel}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-travel_dev_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-travel_bot}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    hostname: travel-rabbitmq
    image: rabbitmq:4.4.0-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-travel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-travel_dev_password}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./backend/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    hostname: travel-backend
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DATABASE: ${MONGO_DATABASE:-travel_bot}
      MONGO_USER: ${MONGO_USER:-travel}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-travel_dev_password}
      RABBITMQ_HOST: travel-rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-travel}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-travel_dev_password}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-local-agent-token-change-me-1234567890}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-change-me-1234567890}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      SSE_POLL_SECONDS: ${SSE_POLL_SECONDS:-0.5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  data-layer:
    hostname: travel-data-layer
    build:
      context: .
      dockerfile: data_layer/Dockerfile
    restart: unless-stopped
    environment:
      PARSER_PORT: "8080"
      PARSER_SERVICE_TOKEN: ${PARSER_SERVICE_TOKEN:-local-parser-token-change-me-1234567890}
      DATA_MODE: ${DATA_MODE:-synthetic}
      YANDEX_RASP_API_KEY: ${YANDEX_RASP_API_KEY:-}
      LITEAPI_KEY: ${LITEAPI_KEY:-}
      OSTROVOK_API_KEY: ${OSTROVOK_API_KEY:-}
    ports:
      - "127.0.0.1:${DATA_LAYER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  agent-worker:
    hostname: travel-agent-worker
    build:
      context: ./agent_worker
    restart: unless-stopped
    environment:
      AGENT_MODE: ${AGENT_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      BACKEND_URL: http://travel-backend:8000
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-local-agent-token-change-me-1234567890}
      PARSER_URL: http://travel-data-layer:8080
      PARSER_SERVICE_TOKEN: ${PARSER_SERVICE_TOKEN:-local-parser-token-change-me-1234567890}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-travel}:${RABBITMQ_PASSWORD:-travel_dev_password}@travel-rabbitmq:5672/%2F
      AGENT_QUEUE: agent.tasks
      AGENT_MAX_CONCURRENT_CHATS: ${AGENT_MAX_CONCURRENT_CHATS:-32}
    depends_on:
      backend:
        condition: service_healthy
      data-layer:
        condition: service_healthy

  frontend:
    hostname: travel-frontend
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://travel-backend:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

